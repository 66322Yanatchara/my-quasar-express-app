services:
  backend:
    build: ./backend
    container_name: my-express-backend-app3
    image: 66322yanatchara/my-express-backend:latest
    env_file:
      - ./backend/.env
    ports:
      - "4000:3000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000
    container_name: my-quasar-frontend-app3
    image: 66322yanatchara/my-quasar-frontend:latest
    ports:
      - "8080:80"
    depends_on:
      - backend
